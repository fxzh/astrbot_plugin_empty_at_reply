name: astrbot_plugin_empty_at_reply
display_name: 空@响应
short_desc: 单独 @ 机器人（不带内容）时也正常回复，修复 qq_official 等平台空 @ 无响应
desc: |
  单独 @ 机器人（不带任何内容）时让机器人也正常回复。

  修复 qq_official（QQ 官方机器人）等平台上空 @ 无响应的问题：
  官方适配器会给空 @ 消息无条件追加空文本段，使消息链恒为两段，
  内置「空@等待」功能（要求链恰好只有一个 @ 段）永远不触发，
  LLM 阶段又因消息为空直接跳过，导致 bot 完全无响应。

  本插件在唤醒检查之后以最高优先级接管这类消息，重摆成
  「@ + 一句话」的普通形状，走正常流程带着完整对话上下文回复；
  并可选开启等待窗口：回复后一段时间内该用户的下一条消息
  （无需再 @）作为正式内容继续对话，按发送者限定不影响他人。
help: '安装后自动生效，无需指令。行为均可在插件配置里调整：占位文本、兜底称呼、等待窗口开关与时长（1-600 秒）。'
